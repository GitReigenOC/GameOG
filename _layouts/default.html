<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101512">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" type="image/png" href="{{ '/Images/BLogo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  {{ content }}
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script type="module" src="{{ '/main.js' | relative_url }}"></script>
</body>
</html>
